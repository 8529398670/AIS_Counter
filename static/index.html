<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title data-i18n="app.title">&nbsp;</title>
  <!-- Before the stylesheets paint, so a saved dark theme never flashes light. -->
  <script src="/js/theme.js"></script>
  <!-- Bootstrap 5 and its icon font, vendored (see /vendor/README.md), then
       this app's overrides on top. -->
  <link rel="stylesheet" href="/vendor/bootstrap.min.css" />
  <link rel="stylesheet" href="/vendor/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <!--
    No text is hardcoded here. Every visible string carries a data-i18n key
    that server/language resolves from language.yaml at runtime, so the copy
    can change (or be removed entirely) without editing this file.

    data-i18n replaces an element's text, so wherever an icon sits next to a
    label the key goes on an inner <span>, never on the element holding both.
  -->
  <nav class="navbar app-navbar border-bottom sticky-top">
    <div class="container-fluid gap-2">
      <!-- The menu button, left, beside the sidebar it controls: on a phone it
           slides the sidebar in, on a wide screen it collapses and expands it
           (remembered in this browser). See Nav.toggleSidebar. -->
      <button id="sidebar-toggle" class="btn btn-link app-icon-button" type="button"
              aria-controls="sidebar" data-i18n-attr="aria-label:nav.menu,title:nav.menu" hidden>
        <i class="bi bi-list" aria-hidden="true"></i>
      </button>
      <!-- The app's name is the way home, from any screen. -->
      <a href="/" class="navbar-brand fw-semibold me-auto" data-i18n="app.title"></a>
      <span class="navbar-text small d-none d-md-inline" data-i18n="app.tagline"></span>
      <div id="app-nav" class="d-flex align-items-center gap-2" hidden>
        <!-- The app's own top-level links go here. Your account is in the
             sidebar, not up here. -->
      </div>
    </div>
  </nav>

  <div class="app-shell">
    <!--
      Every signed-in screen is one entry here and one data-view section in
      <main>. nav.js shows the one the URL hash names, and hides an entry
      whose section the app left hidden (admin-only, switched off, ...).
      offcanvas-lg: a slide-in panel on a phone, a fixed column from lg up.
    -->
    <aside id="sidebar" class="offcanvas-lg offcanvas-start app-sidebar" tabindex="-1" aria-labelledby="sidebar-title" hidden>
      <div class="offcanvas-header border-bottom">
        <h2 class="offcanvas-title h5" id="sidebar-title" data-i18n="app.title"></h2>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebar"
                data-i18n-attr="aria-label:nav.close"></button>
      </div>
      <div class="offcanvas-body">
        <nav id="sidebar-nav" class="nav nav-pills flex-column w-100 gap-1">
          <a class="nav-link" href="#ais" data-nav="ais"><i class="bi bi-bezier2" aria-hidden="true"></i><span data-i18n="nav.ais"></span></a>
          <a class="nav-link" href="#settings" data-nav="settings"><i class="bi bi-sliders" aria-hidden="true"></i><span data-i18n="nav.settings"></span></a>
          <a class="nav-link" href="#about" data-nav="about"><i class="bi bi-info-circle" aria-hidden="true"></i><span data-i18n="nav.about"></span></a>
          <!-- Account: its second line names who is signed in (App.labelAccount). -->
          <a class="nav-link" href="#account" data-nav="account"><i class="bi bi-person-circle" aria-hidden="true"></i><span class="nav-link-text"><span data-i18n="nav.account"></span><span id="sidebar-user" class="nav-link-sub"></span></span></a>
          <a class="nav-link" href="#appearance" data-nav="appearance"><i class="bi bi-palette" aria-hidden="true"></i><span data-i18n="nav.appearance"></span></a>
          <a class="nav-link" href="#pin" data-nav="pin"><i class="bi bi-key" aria-hidden="true"></i><span data-i18n="nav.pin"></span></a>
          <a class="nav-link" href="#api-keys" data-nav="api-keys"><i class="bi bi-code-square" aria-hidden="true"></i><span data-i18n="nav.api_keys"></span></a>

          <div id="sidebar-admin" class="sidebar-group" hidden>
            <h3 class="sidebar-heading" data-i18n="nav.admin_heading"></h3>
            <a class="nav-link" href="#users" data-nav="users"><i class="bi bi-people" aria-hidden="true"></i><span data-i18n="nav.users"></span></a>
            <a class="nav-link" href="#invite-links" data-nav="invite-links"><i class="bi bi-link-45deg" aria-hidden="true"></i><span data-i18n="nav.invite_links"></span></a>
            <a class="nav-link" href="#all-keys" data-nav="all-keys"><i class="bi bi-shield-lock" aria-hidden="true"></i><span data-i18n="nav.all_keys"></span></a>
          </div>
        </nav>
      </div>
    </aside>

    <main hidden id="main" class="app-main">
      <p id="error-banner" class="alert alert-danger" role="alert" hidden></p>

      <section id="signed-out" class="card" hidden>
        <div class="card-body">
          <h2 class="h4 card-title" data-i18n="signed_out.heading"></h2>
          <p data-i18n="signed_out.body"></p>
          <p id="invalid-link" class="alert alert-warning mb-0" data-i18n="signed_out.invalid_link" hidden></p>
        </div>
      </section>

      <!-- What a login link opens. Nothing is redeemed until the button is
           pressed -- see renderLoginConfirm in app.js. -->
      <section id="login-confirm" class="card" hidden>
        <div class="card-body">
          <h2 class="h4 card-title" data-i18n="login_confirm.heading"></h2>
          <p data-i18n="login_confirm.body"></p>
          <p id="login-switch-warning" class="alert alert-warning" hidden></p>
          <button id="login-confirm-button" class="btn btn-primary" data-i18n="login_confirm.button"></button>
        </div>
      </section>

      <!-- What an invite link opens: type a name, then either pick yourself
           from "did you mean" or join as someone new. See join.js. -->
      <section id="join" class="card" hidden>
        <div class="card-body">
          <h2 id="join-heading" class="h4 card-title"></h2>
          <p id="join-invalid" class="alert alert-warning" data-i18n="join.invalid" hidden></p>
          <p id="join-switch-warning" class="alert alert-warning" hidden></p>

          <div id="join-name-step" hidden>
            <p data-i18n="join.body"></p>
            <form id="join-name-form" class="row g-3 align-items-end" autocomplete="off">
              <div class="col-md">
                <label for="join-name" class="form-label" data-i18n="join.name_label"></label>
                <input id="join-name" class="form-control" name="display_name" maxlength="80" required
                       data-i18n-attr="placeholder:join.name_placeholder" />
              </div>
              <div class="col-md-auto">
                <button type="submit" class="btn btn-primary" data-i18n="join.continue_button"></button>
              </div>
            </form>
          </div>

          <div id="join-choose" hidden>
            <p id="join-choose-heading"></p>
            <div id="join-matches" class="list-group mb-3"></div>
            <p id="join-full" class="text-body-secondary" data-i18n="join.full" hidden></p>
            <div class="row-actions">
              <button id="join-create-button" class="btn btn-primary"></button>
              <button id="join-back-button" class="btn btn-outline-secondary" data-i18n="join.back_button"></button>
            </div>
          </div>

          <div id="join-pin-step" hidden>
            <p id="join-pin-prompt"></p>
            <form id="join-pin-form" autocomplete="off">
              <div class="mb-3">
                <label for="join-pin" class="form-label" data-i18n="join.pin_label"></label>
                <input id="join-pin" class="form-control" name="pin" type="password" inputmode="numeric" maxlength="8" required />
              </div>
              <div class="row-actions">
                <button type="submit" class="btn btn-primary" data-i18n="join.pin_button"></button>
                <button type="button" id="join-pin-back-button" class="btn btn-outline-secondary" data-i18n="join.back_button"></button>
              </div>
            </form>
          </div>
        </div>
      </section>

      <section id="signed-in" hidden>
        <!-- Process: the ais_auto.m port. Everything here is driven by
             static/js/ais.js; the analysis runs on the server. -->
        <section class="view ais-view" data-view="ais" id="ais-panel">
          <div class="card mb-3">
            <div class="card-body ais-toolbar">
              <label class="btn btn-primary mb-0 ais-focus-hide">
                <i class="bi bi-folder2-open" aria-hidden="true"></i> <span data-i18n="ais.open_folder"></span>
                <input id="ais-folder" type="file" webkitdirectory multiple hidden />
              </label>
              <label class="btn btn-outline-primary mb-0 ais-focus-hide">
                <i class="bi bi-images" aria-hidden="true"></i> <span data-i18n="ais.open_files"></span>
                <input id="ais-files" type="file" accept=".tif,.tiff" multiple hidden />
              </label>
              <button id="ais-open-path" class="btn btn-outline-primary ais-focus-hide" type="button" hidden>
                <i class="bi bi-hdd" aria-hidden="true"></i> <span data-i18n="ais.open_path"></span>
              </button>
              <button id="ais-batches-open" class="btn btn-outline-secondary ais-focus-hide" type="button">
                <i class="bi bi-collection" aria-hidden="true"></i> <span data-i18n="ais.batches"></span>
              </button>
              <button id="ais-images-open" class="btn btn-outline-secondary ais-focus-hide" type="button" disabled>
                <i class="bi bi-grid-3x3-gap" aria-hidden="true"></i> <span data-i18n="ais.images"></span> <span id="ais-images-count" class="badge text-bg-secondary"></span>
              </button>
              <div class="input-group ais-picker">
                <button id="ais-prev" class="btn btn-outline-secondary" type="button" data-i18n-attr="title:ais.prev"><i class="bi bi-chevron-left" aria-hidden="true"></i></button>
                <select id="ais-image" class="form-select" data-i18n-attr="aria-label:ais.image_label"></select>
                <button id="ais-next" class="btn btn-outline-secondary" type="button" data-i18n-attr="title:ais.next"><i class="bi bi-chevron-right" aria-hidden="true"></i></button>
              </div>
            </div>
          </div>

          <div class="ais-grid">
            <div class="card ais-stage-card">
              <!-- The image being traced: its file, where it is, and the batch's progress. -->
              <div class="card-header ais-current" id="ais-current" hidden>
                <div class="ais-current-name">
                  <div class="small text-body-secondary"><i class="bi bi-collection me-1" aria-hidden="true"></i><span id="ais-batch-name"></span></div>
                  <div class="ais-current-file"><span id="ais-current-pos" class="text-body-secondary me-2"></span><span id="ais-current-stem" class="fw-semibold"></span><span id="ais-current-ext" class="text-body-secondary"></span></div>
                  <div id="ais-current-partner" class="small text-body-secondary ais-current-file"></div>
                </div>
                <div class="btn-group btn-group-sm" role="group">
                  <button id="ais-file-open" class="btn btn-outline-secondary" type="button" data-i18n-attr="title:ais.file_open,aria-label:ais.file_open"><i class="bi bi-box-arrow-up-right" aria-hidden="true"></i></button>
                  <button id="ais-file-reveal" class="btn btn-outline-secondary" type="button" data-i18n-attr="title:ais.file_reveal,aria-label:ais.file_reveal"><i class="bi bi-folder2-open" aria-hidden="true"></i></button>
                  <button id="ais-file-copy" class="btn btn-outline-secondary" type="button" data-i18n-attr="title:ais.file_copy,aria-label:ais.file_copy"><i class="bi bi-clipboard" aria-hidden="true"></i></button>
                  <button id="ais-file-link" class="btn btn-outline-secondary" type="button" data-i18n-attr="title:ais.file_link,aria-label:ais.file_link"><i class="bi bi-link-45deg" aria-hidden="true"></i></button>
                  <div class="btn-group btn-group-sm" role="group" id="ais-matlab-group" hidden>
                    <button id="ais-matlab-menu" class="btn btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" data-i18n-attr="title:ais.matlab,aria-label:ais.matlab"><i class="bi bi-window-stack" aria-hidden="true"></i></button>
                    <ul class="dropdown-menu dropdown-menu-end">
                      <li><button class="dropdown-item" type="button" data-matlab="open"><i class="bi bi-file-earmark-code me-2" aria-hidden="true"></i><span data-i18n="ais.matlab_open"></span></button></li>
                      <li><button class="dropdown-item" type="button" data-matlab="run"><i class="bi bi-play me-2" aria-hidden="true"></i><span data-i18n="ais.matlab_run"></span></button></li>
                    </ul>
                  </div>
                  <button id="ais-file-done" class="btn btn-outline-secondary" type="button" data-i18n-attr="title:ais.file_done,aria-label:ais.file_done" aria-pressed="false"><i class="bi bi-check2-circle" aria-hidden="true"></i></button>
                </div>
                <div class="ais-progress">
                  <span id="ais-upload-status" class="small text-body-secondary"></span>
                  <span id="ais-progress-text" class="small text-body-secondary"></span>
                  <div class="progress" role="progressbar" id="ais-progress-bar-wrap"><div id="ais-progress-bar" class="progress-bar bg-success"></div></div>
                </div>
              </div>
              <div class="ais-stage" id="ais-stage">
                <canvas id="ais-canvas"></canvas>
                <p id="ais-empty" class="ais-empty" data-i18n="ais.empty"></p>
                <p id="ais-status" class="ais-status small" hidden><span id="ais-status-text"></span><button id="ais-status-close" class="btn-close btn-close-white" type="button" data-i18n-attr="title:ais.note_close,aria-label:ais.note_close" hidden></button></p>
                <!-- Pan and zoom: drag (or middle-drag) pans, the wheel zooms; lock freezes the view across images. -->
                <div class="ais-viewtools btn-group-vertical btn-group-sm" role="group">
                  <button id="ais-zoom-in" class="btn btn-dark" type="button" data-i18n-attr="title:ais.zoom_in,aria-label:ais.zoom_in"><i class="bi bi-zoom-in" aria-hidden="true"></i></button>
                  <button id="ais-zoom-level" class="btn btn-dark ais-zoom-level" type="button" data-i18n-attr="title:ais.zoom_100"></button>
                  <button id="ais-zoom-out" class="btn btn-dark" type="button" data-i18n-attr="title:ais.zoom_out,aria-label:ais.zoom_out"><i class="bi bi-zoom-out" aria-hidden="true"></i></button>
                  <button id="ais-view-lock" class="btn btn-dark" type="button" data-i18n-attr="title:ais.view_lock,aria-label:ais.view_lock" aria-pressed="false"><i class="bi bi-unlock" aria-hidden="true"></i></button>
                  <button id="ais-view-reset" class="btn btn-dark" type="button" data-i18n-attr="title:ais.view_reset,aria-label:ais.view_reset"><i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i></button>
                  <button id="ais-focus" class="btn btn-dark" type="button" data-i18n-attr="title:ais.focus,aria-label:ais.focus" aria-pressed="false"><i class="bi bi-arrows-fullscreen" aria-hidden="true"></i></button>
                </div>
              </div>
              <div class="card-footer ais-layers small">
                <span id="ais-hint" class="ais-hint text-body-secondary"><span data-i18n="ais.hint"></span><button id="ais-hint-close" class="btn-close" type="button" data-i18n-attr="title:ais.hint_close,aria-label:ais.hint_close"></button></span>
                <button id="ais-hint-show" class="btn btn-link btn-sm p-0 text-body-secondary" type="button" data-i18n-attr="title:ais.hint_show,aria-label:ais.hint_show" hidden><i class="bi bi-question-circle" aria-hidden="true"></i></button>
                <span class="ms-auto d-flex flex-wrap gap-3">
                  <label class="form-check-label"><input class="form-check-input me-1" type="checkbox" data-layer="component" checked /><span data-i18n="ais.layer_component"></span></label>
                  <label class="form-check-label"><input class="form-check-input me-1" type="checkbox" data-layer="skeleton" checked /><span data-i18n="ais.layer_skeleton"></span></label>
                  <label class="form-check-label"><input class="form-check-input me-1" type="checkbox" data-layer="trace" checked /><span data-i18n="ais.layer_trace"></span></label>
                  <label class="form-check-label"><input class="form-check-input me-1" type="checkbox" data-layer="spline" checked /><span data-i18n="ais.layer_spline"></span></label>
                  <label class="form-check-label"><input class="form-check-input me-1" type="checkbox" data-layer="saved" checked /><span data-i18n="ais.layer_saved"></span></label>
                  <label class="d-flex align-items-center gap-1"><span data-i18n="ais.brightness"></span><input id="ais-gamma" type="range" class="form-range ais-gamma" min="0.2" max="1.5" step="0.05" value="1" /></label>
                </span>
              </div>
            </div>

            <div class="card ais-result-card">
              <div class="card-body">
                <h2 class="h5 card-title" data-i18n="ais.result_heading"></h2>
                <p id="ais-result-none" class="text-body-secondary small" data-i18n="ais.result_none"></p>
                <div id="ais-result" hidden>
                  <div class="ais-length"><span id="ais-length"></span> <span class="small text-body-secondary">µm</span></div>
                  <p id="ais-error" class="alert alert-warning small py-2" hidden></p>
                  <dl class="ais-measures small" id="ais-measures"></dl>
                  <div id="ais-profile" class="ais-profile"></div>
                  <ul id="ais-notes" class="small text-body-secondary ps-3"></ul>
                  <div class="row-actions">
                    <button id="ais-accept" class="btn btn-primary btn-sm" type="button"><i class="bi bi-check-lg" aria-hidden="true"></i> <span data-i18n="ais.accept"></span></button>
                    <button id="ais-reject" class="btn btn-outline-secondary btn-sm" type="button"><i class="bi bi-x-lg" aria-hidden="true"></i> <span data-i18n="ais.reject"></span></button>
                    <button id="ais-replay" class="btn btn-outline-secondary btn-sm" type="button" hidden data-i18n-attr="title:ais.replay_help"><i class="bi bi-window-stack" aria-hidden="true"></i> <span data-i18n="ais.replay"></span></button>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="card mt-3 ais-focus-hide">
            <div class="card-body">
              <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
                <h2 class="h5 card-title mb-0 me-auto" data-i18n="ais.results_heading"></h2>
                <select id="ais-table-scope" class="form-select form-select-sm w-auto" data-i18n-attr="aria-label:ais.scope_label">
                  <option value="batch" data-i18n="ais.scope_batch"></option>
                  <option value="all" data-i18n="ais.scope_all"></option>
                </select>
                <div class="btn-group">
                  <button id="ais-export" class="btn btn-outline-primary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false"><i class="bi bi-download" aria-hidden="true"></i> <span data-i18n="ais.export"></span></button>
                  <ul class="dropdown-menu dropdown-menu-end">
                    <li><button id="ais-export-csv" class="dropdown-item" type="button"><i class="bi bi-filetype-csv me-2" aria-hidden="true"></i><span data-i18n="ais.export_csv"></span></button></li>
                    <li><button id="ais-export-zip" class="dropdown-item" type="button"><i class="bi bi-file-zip me-2" aria-hidden="true"></i><span data-i18n="ais.export_zip"></span></button></li>
                  </ul>
                </div>
                <button id="ais-clear" class="btn btn-outline-danger btn-sm" type="button" data-i18n="ais.clear"></button>
              </div>
              <div class="table-responsive">
                <table class="table table-sm align-middle mb-0 small" id="ais-table">
                  <thead><tr>
                    <th data-i18n="ais.col_image"></th><th>#</th><th data-i18n="ais.col_length"></th><th data-i18n="ais.col_start"></th>
                    <th data-i18n="ais.col_end"></th><th data-i18n="ais.col_max"></th><th data-i18n="ais.col_threshold"></th><th data-i18n="ais.col_click"></th>
                    <th data-i18n="ais.col_source"></th><th data-i18n="ais.col_batch"></th><th></th>
                  </tr></thead>
                  <tbody></tbody>
                </table>
              </div>
            </div>
          </div>

          <!-- Images: which of the opened batch to step through (static/js/ais_images.js).
               Opens after a folder is opened; the selection applies on "Use". -->
          <div class="modal fade" id="ais-images-modal" tabindex="-1" aria-labelledby="ais-images-title" aria-hidden="true">
            <div class="modal-dialog modal-xl modal-fullscreen-lg-down modal-dialog-scrollable ais-images-dialog">
              <div class="modal-content">
                <div class="modal-header flex-wrap gap-2">
                  <div class="me-auto ais-images-heading">
                    <h2 class="modal-title h5 mb-0" id="ais-images-title" data-i18n="ais.images"></h2>
                    <div id="ais-images-batch" class="small text-body-secondary text-truncate"></div>
                  </div>
                  <input id="ais-images-filter" class="form-control form-control-sm ais-images-filter" type="search" data-i18n-attr="placeholder:ais.filter,aria-label:ais.filter" />
                  <div id="ais-images-dups" class="form-check form-switch mb-0 small" hidden>
                    <input id="ais-images-hide-dups" class="form-check-input" type="checkbox" />
                    <label class="form-check-label" for="ais-images-hide-dups"><span data-i18n="ais.hide_duplicates"></span> (<span id="ais-images-dups-count"></span>)</label>
                  </div>
                  <span id="ais-images-selected" class="small text-body-secondary"></span>
                  <button id="ais-images-all" class="btn btn-outline-secondary btn-sm" type="button" data-i18n="ais.select_all"></button>
                  <button id="ais-images-none" class="btn btn-outline-secondary btn-sm" type="button" data-i18n="ais.select_none"></button>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" data-i18n-attr="aria-label:nav.close"></button>
                </div>
                <div class="modal-body">
                  <p class="small text-body-secondary mb-2" data-i18n="ais.list_hint"></p>
                  <div id="ais-images-grid" class="ais-images-grid" role="listbox" aria-multiselectable="true" tabindex="0" data-i18n-attr="aria-label:ais.images"></div>
                </div>
                <div class="modal-footer">
                  <span id="ais-images-progress" class="small text-body-secondary me-auto"></span>
                  <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" data-i18n="ais.cancel"></button>
                  <button id="ais-images-use" type="button" class="btn btn-primary"></button>
                </div>
              </div>
            </div>
          </div>

          <!-- Batches: every opened folder, shared by all signed-in users (app/models/ais.py). -->
          <div class="modal fade" id="ais-batches-modal" tabindex="-1" aria-labelledby="ais-batches-title" aria-hidden="true">
            <div class="modal-dialog modal-xl modal-dialog-scrollable">
              <div class="modal-content">
                <div class="modal-header">
                  <h2 class="modal-title h5" id="ais-batches-title" data-i18n="ais.batches"></h2>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" data-i18n-attr="aria-label:nav.close"></button>
                </div>
                <div class="modal-body">
                  <p id="ais-batches-none" class="text-body-secondary small" data-i18n="ais.batches_none" hidden></p>
                  <div class="table-responsive">
                    <table class="table table-sm align-middle small mb-0">
                      <thead><tr>
                        <th data-i18n="ais.batch_col_name"></th><th data-i18n="ais.batch_col_done"></th><th data-i18n="ais.batch_col_dups"></th>
                        <th data-i18n="ais.batch_col_by"></th><th data-i18n="ais.batch_col_when"></th><th></th>
                      </tr></thead>
                      <tbody id="ais-batches-list"></tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>
          </div>
