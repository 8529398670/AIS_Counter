  auto_method_fitted2: "Fitted 2: by contrast (second trial)"
  auto_method_learned: "Learned from 3,277 hand-clicked AIS (trial)"
  auto_method_help: "Classic is auto mode as it has always been, with the settings below. Fitted (the default; a trial, kept separate so Classic stays as it is): each trace starts where a person would click, a few µm into the AIS from its brighter or soma end, and blobs are kept by length, brightness and how branched they are, with values fitted to AIS clicked by hand. Fitted 2 (a second trial, so Fitted stays as it is): Fitted learnt again with the AIS it missed, which keeps bright AIS that fill their whole blob and judges by contrast with the background around each AIS instead of brightness, so it finds a few more. Learned (a third trial, built apart from the others): tries many clicks along every large blob and keeps the ones a model trained on batches C2 and C4-C7 says a person would have made, each with a score."
  auto_start_label: "Where a trace starts"
  auto_start_soma: "Soma end (else both)"
  auto_start_both: "Try both ends, keep the better"
  auto_start_brighter: "Brighter end"
  auto_start_dimmer: "Dimmer end"
  auto_start_help: "The original walks from the click. Soma: start at the end nearer a cell body (found in whichever channel shows cell bodies), as an AIS leaves its soma; where no channel does, and on a Z-stack, this is Both. Both: trace from each end of the blob, keep the one that measures (then the longer trace). Brighter / dimmer: start at that end of the raw image (the other only if it fails)."
  auto_min_length_label: "Shortest AIS auto keeps"
  auto_min_length_help: "Auto leaves out anything shorter, which drops most specks. The general minimum above applies too. 0 is off."
  auto_min_brightness_label: "Dimmest AIS auto keeps"
  auto_min_brightness_help: "Mean brightness of the measured AIS, as a % of the image's bright level (its 99.9th percentile). Specks in the background are dim, so this drops most of them. 0 is off."
  auto_min_width_label: "Thinnest AIS auto keeps"
  auto_min_width_help: "Median width of the measured AIS: twice the distance to the blob's edge. Specks are thin. 0 is off."
  auto_max_soma_gap_label: "Furthest from a soma auto keeps"
  auto_max_soma_gap_help: "How far an AIS's start may be from the nearest cell body, found in whichever channel shows them. Somata out of focus or off the image are not found, so keep this loose. 0 is off; images where no channel shows cell bodies are never filtered by it."
  fitted_min_length_label: "Shortest AIS auto keeps"
  fitted_min_length_help: "Judged on the trace from the blob's end, as Classic measures it, so the length shown can be a little shorter. The general minimum above applies to the length shown. 0 is off."
  fitted_min_brightness_label: "Dimmest AIS auto keeps"
  fitted_min_brightness_help: "Mean brightness of that trace's AIS, as a % of the image's bright level (its 99.9th percentile). 0 is off."
  fitted_max_branchiness_label: "Most branched blob auto keeps"
  fitted_max_branchiness_help: "The blob's skeleton length over the traced length: 1 is a single unbranched line. Forked and tangled blobs (crossings, dendrites, merged AIS) score higher. Raise it to find more AIS that touch something else, at the cost of more wrong ones. 0 is off."
  fitted2_min_contrast_label: "Lowest contrast auto keeps"
  fitted2_min_contrast_help: "How much brighter the AIS is than the background 1-2 µm around it, as a % of the image's bright level (its 99.9th percentile). A clear AIS still passes in an image with a few very bright spots. Lower it to find more, raise it (to about 37) for fewer wrong ones. 0 is off."
  learned_min_score_label: "Lowest score auto keeps"
  learned_min_score_help: "Each candidate's score is how likely the model finds it that a person would have clicked that AIS there. Lower it to find more AIS, at the cost of more wrong ones; raise it for fewer wrong ones. 0 keeps every candidate."
  learned_min_length_help: "The length shown, as saved. The general minimum above applies too. 0 is off: the score already weighs length."
  fitted2_min_brightness_help: "Mean brightness of that trace's AIS, as a % of the image's bright level (its 99.9th percentile), on top of contrast. Off (0) by default: contrast does its job. 0 is off."
  auto_skip_done_label: "Skip images already done"
  auto_skip_done_help: "Leave out images that have an accepted AIS or are marked done."
  threshold_help: "ais_auto's threshold argument: the starting level on the smoothed image. 0 uses Otsu (graythresh), as in the original."
  smooth_label: "Smoothing filter"
  smooth_help: "ais_auto's smooth argument, passed to fspecial(smooth, [kernel kernel], sigma) (line 37). Only these two types accept that call; MATLAB errors on the others."
  smooth_gaussian: "gaussian (original)"
  smooth_log: "log (Laplacian of Gaussian)"
  constants: "Original constants"
  constants_help: "Numbers ais_auto.m hard-codes, the original's values by default. Changed ones are written into a copy of ais_auto.m (ais_auto_settings.m) when this image is opened or replayed in MATLAB, so both give the same result."
  constants_reset: "Reset to the original's values"
  pixconv_label: "Microns per pixel (pixconv)"
  pixconv_help: "Line 5. Converts every position and length to µm, and sets the sliding-mean width in pixels."
  f_label: "Start/end fraction (f)"
  f_help: "Line 6. AIS start and end are where the normalised profile crosses this fraction of its peak (Grubb & Burrone 2010)."
  kernel_label: "Smoothing kernel size"
  kernel_help: "Line 37: the [kernel kernel] size given to fspecial."
  sigma_label: "Smoothing sigma"
  sigma_help: "Line 37: the standard deviation given to fspecial."
  strel_label: "Open/close square size"
  strel_help: "Lines 70-71: strel('square', n) for the opening and closing after thresholding."
  min_pixels_label: "Minimum blob size"
  min_pixels_help: "Line 87: connected components with fewer pixels than this are dropped."
  max_path_label: "Trace length cap"
  max_path_help: "Line 192: tracing stops once the path is longer than this many pixels."
  max_passes_label: "Branch passes"
  max_passes_help: "Line 233: the trace is re-run without a branch at most this many extra times."
  spline_p_label: "Spline smoothing (csaps p)"
  spline_p_help: "Line 272: 0 is a straight line, 1 goes through every trace pixel."
  window_um_label: "Sliding mean half-width"
  window_um_help: "Line 402: the profile is averaged over this many µm each side (in pixels: round(width / pixconv) + 1)."

# The Instructions screen (index.html, data-view="instructions"): how to use
# the Process screen. {key:...} is the key as it is bound now.
instructions:
  heading: "Instructions"
  description: "How to trace, edit, measure and review AIS on the Process screen. Every key named here can be changed under Keyboard shortcuts, and this page follows."
  tracing_heading: "Tracing an AIS"
  tracing_click: "Click just outside the start of an AIS. The blob, its skeleton and the trace are drawn over the image, and the length shows on the right."
  tracing_walk: "{key:ais.nudge_left} {key:ais.nudge_right} {key:ais.nudge_up} {key:ais.nudge_down} walk the click a pixel at a time and trace again."
  tracing_accept: "{key:ais.accept} accepts the trace, {key:ais.reject} rejects it. Switching image drops a click not yet accepted."
  tracing_images: "{key:ais.prev_image} / {key:ais.next_image} switch images."
  tracing_view: "Scroll, {key:ais.zoom_in} (in) and {key:ais.zoom_out} (out) zoom, drag pans, {key:ais.reset_view} resets the view, {key:ais.lock_view} locks it across images, {key:ais.focus} toggles focus mode. The buttons for these, Brightness and undo / redo are in the column at the image's top right (it shows when hovered)."
  tracing_short: "Traces under Settings › Minimum AIS length are skipped and cannot be accepted."
  tools_heading: "Click tools"
  tools_intro: "The buttons at the image's top right (they show when hovered) pick what a click does. Each stays on until you pick another."
  tool_trace: "Trace ({key:ais.tool_trace}): a click traces a new AIS."
  tool_edit: "Edit ({key:ais.tool_edit}): click a trace, then walk its start with {key:ais.nudge_left} {key:ais.nudge_right} {key:ais.nudge_up} {key:ais.nudge_down} or click a new start; {key:ais.accept} updates it, {key:ais.cancel_edit} cancels."
  tool_delete: "Delete ({key:ais.tool_delete}): click a trace to delete it."
  tool_measure: "Measure ({key:ais.tool_measure}): each AIS's start to its soma, saved with the AIS. See Measuring."
  measure_heading: "Measuring"
  measure_modes: "The Measure panel offers three ways: start on the AIS's thicker end, click the start yourself, or Manual, which measures anything on any image."
  measure_ready: "Drag either end, or click one and use {key:measure.nudge_left} {key:measure.nudge_right} {key:measure.nudge_up} {key:measure.nudge_down}; {key:measure.switch_end} switches ends."
  measure_selected: "With an end picked (it is ringed): drag it, click where it goes, or move it with {key:measure.nudge_left} {key:measure.nudge_right} {key:measure.nudge_up} {key:measure.nudge_down} ({key:measure.nudge_big_left} {key:measure.nudge_big_right} {key:measure.nudge_big_up} {key:measure.nudge_big_down}: 5 px). {key:measure.let_go} lets go."
  measure_swap: "{key:measure.swap_end} measures from the trace's other end, when the end picked is the one away from the soma. A guess the app is unsure of says so in the panel."
  measure_save: "{key:measure.save_next} saves and moves to the next AIS, {key:measure.skip} skips one, {key:measure.prev_ais} / {key:measure.next_ais} step back and forward."
  measure_manual: "Manual: click two points to record a line, as many as you like. Press an end to adjust it; {key:measure.delete_line} deletes the newest. {key:measure.prev_ais} and {key:measure.next_ais} change image."
  measure_manual_selected: "Manual, with a line's end picked: drag it or move it with {key:measure.nudge_left} {key:measure.nudge_right} {key:measure.nudge_up} {key:measure.nudge_down}; {key:measure.delete_line} deletes that line, a click elsewhere starts a new one."
  measure_options: "The arrow beside Measure in the toolbar has its options: a zoom loupe at the pointer, snapping to pixel centres, µm and px, the soma in front of the AIS (found in whichever channel shows cell bodies: each soma the largest ellipse inside it; the scissors beside Soma split touching somata, and the sliders set a soma's size range and roundness), and zooming to each start."
  auto_heading: "Reviewing auto mode"
  auto_review: "Delete tool ({key:ais.tool_delete}): click a saved AIS to remove it. Edit tool ({key:ais.tool_edit}): click one, then walk its start with {key:ais.nudge_left} {key:ais.nudge_right} {key:ais.nudge_up} {key:ais.nudge_down} or click a new start; {key:ais.accept} updates it."
  auto_add: "Click with the Trace tool ({key:ais.tool_trace}) to add one it missed."
  auto_done: "{key:auto.next} marks the image done, {key:auto.skip} skips it, {key:auto.stop} stops."
  key_undo: "{key:ais.undo} undoes, {key:ais.redo} redoes an accepted, edited or deleted AIS."
  key_rebind: "Every key can be changed under Keyboard shortcuts."

# The About screen (static/js/about.js): what the Process screen draws, its
# numbers and keys, the MATLAB it can call, and the full ais_auto.m report.
about:
  heading: "About"
  description: "What the Process screen's numbers mean, what MATLAB is needed for, and everything known about the original ais_auto.m and how this port copies it."
  # The facts card at the top (about.js), shown while app.show_about is on:
  # app.description, the version, app.repo and the API and MCP references.
  version: "Version"
  source: "Source"
  api_reference: "API reference"
  api_link: "openapi.json"
  mcp_reference: "MCP reference"
  mcp_link: "mcp.json"
  instructions_link: "How to trace, measure and review: Instructions"
  source_label: "Source code:"
  legend_heading: "What the colors mean"
  legend_intro: "After a click the image is overlaid with each stage of the original's pipeline. Each one can be hidden under Appearance; thickness is in Settings."
  legend_component_name: "Component (cyan dots)."
  legend_component: "The outline of the segmented blob picked by the click: the image smoothed, thresholded, opened and closed, and the blob nearest the click. After re-thresholding it is the blob at the lower threshold."
  legend_skeleton_name: "Skeleton (red dots)."
  legend_skeleton: "That blob thinned to a one-pixel-wide line. Branches show here; only one route through them is kept."
  legend_trace_name: "Trace (blue line by default)."
  legend_trace: "The profile pixels: the spline rounded back to whole pixels with repeats removed. The intensity profile is read from the raw image at these pixels, and start, end and length are counted along them. Its colour is set in Settings."
  legend_spline_name: "Spline (yellow line)."
  legend_spline: "The smoothing spline (csaps, 0.3) fitted through the longest route walked along the skeleton. It irons out the skeleton's zig-zags."
  legend_saved_name: "Saved (green line by default, numbered)."
  legend_saved: "AIS already accepted on this image, by anyone, with their number from the results table. These are what the exported PNGs show. Their colour is set in Settings."
  legend_start_name: "Path start (white +)."
  legend_start: "The skeleton pixel nearest the click, where the walk along the skeleton begins. Not the AIS start, which is read from the profile."
  legend_click_name: "Your click (orange +)."
  legend_click: "Where you clicked, or where Alt+arrow keys have moved it. With two clicks both are shown."
  measures_heading: "The numbers"
  measure_length_name: "Length"
  measure_length: "AIS end − AIS start, in µm (0.161 µm per profile pixel). Traces shorter than Settings › Minimum AIS length are skipped."
  measure_start: "Distance along the trace to the last point before the peak where the smoothed, normalised intensity is under 33 % of the peak (0 if there is none)."
  measure_end: "Distance to the last point after the peak still above 33 %."
  measure_mid: "Halfway between start and end."
  measure_max: "Distance to the intensity peak."
  measure_threshold: "The segmentation threshold. Initial → final when the original re-thresholded by how bright the chosen blob is (almost every click)."
  measure_component: "Size of the chosen blob in pixels."
  measure_trace: "Profile pixels, and how many passes the skeleton walk took (the longest is kept)."
  keys_heading: "Mouse and keys"
  key_click: "Click just outside the start of an AIS to trace it."
  key_arrows: "{key:ais.nudge_left} {key:ais.nudge_right} {key:ais.nudge_up} {key:ais.nudge_down} walk the click 1 px ({key:ais.nudge_big_left} {key:ais.nudge_big_right} {key:ais.nudge_big_up} {key:ais.nudge_big_down}: 5 px) and re-trace each time. {key:ais.prev_image} / {key:ais.next_image} switch images and drop it."
  key_enter: "{key:ais.accept} accepts the trace (not if it was skipped as too short)."
  key_reject: "{key:ais.reject} rejects it."
  key_done: "{key:auto.next} marks the image done in auto mode's review."
  key_pages: "{key:ais.prev_image} / {key:ais.next_image} switch images."
  key_zoom: "The wheel, {key:ais.zoom_in} (in) and {key:ais.zoom_out} (out) zoom, drag pans, {key:ais.actual_size} is 100 %, {key:ais.reset_view} fits the image."
  key_lock: "{key:ais.lock_view} locks pan and zoom so every image opens at the same view."
  key_focus: "{key:ais.focus} toggles focus mode."
  matlab_heading: "MATLAB requirements"
  matlab_intro: "Nothing here needs MATLAB to trace: the analysis is a Python port. MATLAB is only for Verify in MATLAB (running the original on the same image), Download MATLAB Replay, and the parity tests."
  matlab_version: "MATLAB R2026b, the release the port was matched against."
  matlab_toolboxes: "Image Processing Toolbox (mat2gray, fspecial, imfilter, im2bw, imopen, imclose, bwconncomp, bwdist, bwmorph) and Curve Fitting Toolbox (csaps)."
  matlab_where: "Three ways to reach it. Anywhere, Docker included: Download MATLAB Replay saves a zip that opens your MATLAB. Anywhere, with no zip: run the MATLAB helper on your computer (Account). At the server's own computer: an admin session in a browser on that computer, with the server listening on loopback, not in Docker, and server.local_folders: true. Through a tunnel or proxy that does not count, even on the same computer."
  matlab_config: "Your MATLAB path under Account is used by your zips and your helper. Empty finds the newest install. server.matlab in config/config.yaml is the MATLAB the server opens on itself, and is separate."
  matlab_parity: "The parity run (scripts/parity.sh, then pytest tests/) also needs the sample images in example-data/."
  report_heading: "The ais_auto.m report"
  report_intro: "From docs/ais_auto_report.md: the pipeline stage by stage, every quirk of the original and how the port keeps it, the MATLAB behaviour copied exactly, crashes, dead code, and how the 1-to-1 match was proven."
  report_loading: "Loading…"
  report_error: "Could not load the report."

